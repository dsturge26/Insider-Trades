name: Update data

# Refreshes the JSON the dashboard reads, then commits it back to the branch.
# - Congress trades: live when the FMP_API_KEY secret is set (otherwise seed data is kept).
# - Trump ticker prices: always refreshed from Stooq (no key needed).
on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 min: Trump posts + prices refresh fast;
                            # congress (FMP) self-throttles to ~every 6h.
  workflow_dispatch: {}     # manual run forces a full refresh (congress included)

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch congressional trades (FMP)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # Manual runs force a refresh; scheduled runs skip if data < 6h old.
          CONGRESS_MAX_AGE_HOURS: ${{ github.event_name == 'workflow_dispatch' && '0' || '6' }}
        run: python scripts/fetch_congress.py

      - name: Fetch Trump's latest Truth Social posts (CNN archive)
        run: python scripts/fetch_trump_posts.py

      - name: Refresh Trump-ticker prices (FMP + Stooq fallback)
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python scripts/fetch_prices.py

      - name: Stamp freshness metadata
        run: python scripts/stamp_meta.py

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh trade + price data [skip ci]"
            git push
          fi
