name: Backtest signals

# On-demand: replays history through the classifier and measures forward returns.
# Run from the Actions tab. Tune months / max posts to control cost + runtime.
on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months of history to test"
        default: "24"
      max_posts:
        description: "Max posts to classify (cost cap)"
        default: "4000"
      reuse:
        description: "Reuse cached signals (skip classification, free)"
        default: "false"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet anthropic

      - name: Run backtest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BACKTEST_MONTHS: ${{ github.event.inputs.months }}
          BACKTEST_MAX_POSTS: ${{ github.event.inputs.max_posts }}
          BACKTEST_REUSE: ${{ github.event.inputs.reuse }}
        run: python scripts/backtest.py

      - name: Commit results (always — keeps cached signals + debug)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/backtest_results.json backtest_report.md data/backtest_signals_raw.json data/_debug_backtest.json
          if git diff --cached --quiet; then
            echo "No changes."; exit 0
          fi
          git commit -m "chore: backtest results [skip ci]"
          # Rebase + retry so a concurrent Update-data push doesn't drop results.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && { echo "pushed"; exit 0; }
            echo "push retry $i"; sleep $((2 ** i))
          done
          echo "push failed after retries"; exit 1
